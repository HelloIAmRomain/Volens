# CI Volens [DT-19] : à chaque poussée — tests unitaires, tests
# d'architecture, tests d'or (dès qu'ils existent, découverte par
# sous-répertoires), et double exécution de la simulation de fumée pour
# constater le déterminisme sur x86_64.
#
# La CI ne signe ni ne publie rien : aucun secret de production (DT-19).

name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.1
  GODOT_BIN: Godot_v4.7.1-stable_linux.x86_64

jobs:
  tests:
    runs-on: ubuntu-latest
    # PORTÉ DE 15 À 30 MINUTES. Les bibliothèques de niveaux sont passées de
    # trois à cinq ou six règles le 15 août 2026 pour rendre au joueur un vrai
    # choix : l'espace énuméré est passé de 15 piles par niveau à 85-516, et la
    # suite de quatre minutes à une quinzaine. Le plafond de 15 devenait la
    # cause d'échec la plus probable, ce qui est exactement ce qu'un plafond ne
    # doit pas être.
    timeout-minutes: 30
    steps:
      - name: Dépôt
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Télécharger Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_BIN}.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/${GODOT_BIN}

      # ESPACE DES SOLUTIONS — le poste le plus cher de la suite, et il est
      # PUREMENT DÉRIVÉ des niveaux et des paramètres de règles. Le calculer à
      # neuf à chaque passage coûte une dizaine de minutes pour un résultat
      # identique tant qu'aucun de ces fichiers n'a bougé.
      #
      # LA CLÉ EST L'EMPREINTE DES ENTRÉES, pas une date ni un numéro de
      # passage : un cache dont la clé ne couvre pas tout ce dont le résultat
      # dépend sert une réponse périmée sans le dire, et c'est le seul mode de
      # panne d'un cache qui coûte plus cher que l'absence de cache.
      # `CatalogueSolutions` vérifie la même empreinte de son côté et jette le
      # fichier s'il ne correspond pas : la clé GitHub est une optimisation, pas
      # la garantie.
      - name: Cache de l'espace des solutions
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/app_userdata/Volens
          key: solutions-${{ hashFiles('data/levels/*.json', 'data/rules.json') }}

      - name: Importer le projet (enregistrement des class_name)
        run: ~/godot-bin/${GODOT_BIN} --headless --path . --import

      - name: Tests (unitaires + architecture + or)
        run: |
          ~/godot-bin/${GODOT_BIN} --headless --path . \
            -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit \
            | tee /tmp/gut.log
          # Cette ligne exige le verdict PLEIN de GUT, et c'est voulu : GUT
          # remplace « All tests passed! » par « N pending/risky tests. » dès
          # qu'un test n'asserte rien. Un test sans assertion ressemble à un
          # test et ne prouve rien — cas rencontré le 10 août 2026, quand une
          # liste de manquements connus s'est vidée et que la boucle qui
          # l'assertait n'a plus rien parcouru. Ne jamais assouplir en
          # tolérant « risky » : c'est précisément ce qu'on veut voir.
          grep -q -- "---- All tests passed! ----" /tmp/gut.log

      - name: Cohérence du nombre de tests (aucune suite silencieusement ignorée)
        run: |
          # Le nombre de tests exécutés par GUT doit égaler le nombre de
          # fonctions test_ déclarées sous tests/. Auto-ajustant : aucun
          # compteur à maintenir à la main. Si des tests paramétrés
          # apparaissent un jour, l'écart déclaré/exécuté devra être rendu
          # EXPLICITE ici (variable dédiée et commentée) — jamais absorbé
          # en assouplissant ce contrôle.
          declared=$(grep -rh --include="*.gd" "^func test_" tests/ | wc -l)
          executed=$(grep -oP '^Tests\s+\K[0-9]+' /tmp/gut.log | head -1)
          echo "déclarés : $declared — exécutés : $executed"
          test -n "$executed" && test "$declared" -eq "$executed"

      - name: Déterminisme x86_64 — deux exécutions, empreintes identiques
        run: |
          run_hash() {
            ~/godot-bin/${GODOT_BIN} --headless --path . \
              --script res://tools/run_sim.gd -- --level=test_smoke --ticks=300 \
              | grep "empreinte finale" | awk '{print $3}'
          }
          H1=$(run_hash); H2=$(run_hash)
          echo "empreintes : $H1 / $H2"
          test -n "$H1" && test "$H1" = "$H2"
