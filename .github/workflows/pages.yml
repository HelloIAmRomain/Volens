# Publie la politique de confidentialité (docs/legal/site/) sur GitHub Pages.
#
# URL : https://helloiamromain.github.io/Volens/
# Elle doit rester accessible tant que l'application est publiée : l'URL est
# déclarée à Google Play. Seul le dossier docs/legal/site/ est publié — ni le
# code, ni le reste de docs/.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/legal/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dépôt
        uses: actions/checkout@v4

      - name: Contrôle — aucune ressource externe dans la page
        run: |
          n=$(grep -cE '<(script src|link rel="stylesheet"|img|iframe)' docs/legal/site/index.html || true)
          test "$n" = "0"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/legal/site

      - id: deployment
        uses: actions/deploy-pages@v4
